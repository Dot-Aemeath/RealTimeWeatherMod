# RealTimeWeatherMod - PR Review via OpenCodeReview
#
# Adapted from https://github.com/alibaba/open-code-review/tree/main/examples/github_actions
#
# Triggers:
#   - PR opened/synchronized (pull_request_target for fork secret access)
#   - Comment on PR starting with /review
#
# Required secret: DEEPSEEK_API_KEY

name: PR Review

concurrency:
  group: pr-review-${{ github.repository }}-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr_number }}
  cancel-in-progress: true

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to review
        required: true
        type: number

permissions:
  contents: read
  pull-requests: write
  statuses: write

jobs:
  review:
    if: |
      (github.event_name == 'pull_request_target') ||
      (github.event_name == 'workflow_dispatch') ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && startsWith(github.event.comment.body, '/review'))
    runs-on: ubuntu-latest
    steps:
      - name: Get PR context
        id: pr-context
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number || inputs.pr_number }}
        with:
          script: |
            const prNumber = Number(process.env.PR_NUMBER);
            if (!Number.isSafeInteger(prNumber) || prNumber <= 0) {
              throw new Error('Invalid pull request number');
            }
            const { data: pullRequest } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            });
            if (pullRequest.state !== 'open') {
              throw new Error('Pull request is not open');
            }
            core.setOutput('pr_number', prNumber);
            core.setOutput('base_sha', pullRequest.base.sha);
            core.setOutput('head_sha', pullRequest.head.sha);
            await github.rest.repos.createCommitStatus({
              ...context.repo,
              sha: pullRequest.head.sha,
              state: 'pending',
              context: 'PR Review',
              description: 'Reviewing this pull request commit',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });

      # Keep all executable code and reviewer configuration on the trusted base.
      # OCR reads the PR through --to; fetching objects does not check out fork files.
      - name: Checkout base repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ steps.pr-context.outputs.base_sha }}
          persist-credentials: false

      - name: Fetch PR objects
        env:
          PR_NUMBER: ${{ steps.pr-context.outputs.pr_number }}
          HEAD_SHA: ${{ steps.pr-context.outputs.head_sha }}
        run: |
          git fetch --no-tags origin "refs/pull/$PR_NUMBER/head"
          test "$(git rev-parse FETCH_HEAD)" = "$HEAD_SHA"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install OpenCodeReview
        run: npm install -g @alibaba-group/open-code-review

      - name: Run review
        id: review
        timeout-minutes: 20
        env:
          BASE_SHA: ${{ steps.pr-context.outputs.base_sha }}
          HEAD_SHA: ${{ steps.pr-context.outputs.head_sha }}
          OCR_LLM_URL: https://opencode.ai/zen/go/v1
          OCR_LLM_TOKEN: ${{ secrets.DEEPSEEK_API_KEY }}
          OCR_LLM_MODEL: deepseek-v4-pro
          OCR_USE_ANTHROPIC: 'false'
          OCR_LLM_EXTRA_HEADERS: x-opencode-session=rtw-pr-${{ steps.pr-context.outputs.pr_number }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          if [ -z "$OCR_LLM_TOKEN" ]; then
            echo '::error::DEEPSEEK_API_KEY is not configured'
            exit 1
          fi
          ocr review \
            --from "$BASE_SHA" \
            --to "$HEAD_SHA" \
            --audience agent \
            --format json \
            --concurrency 2 \
            --timeout 15 \
            --background "C# Unity BepInEx mod for Chill With You Lo-Fi Story. RealTimeWeatherMod/ (plugin: Core/automation, Patches/Harmony, Services/IO, Pure/Core+Services+Models/Unity-free logic), UnityExplorerMcp/ (MCP bridge), RealTimeWeatherMod.Tests/ and UnityExplorerMcp.Tests/ (xUnit .NET 9). Critical: Unity main thread safety, Harmony patch non-destructiveness, IDisposable cleanup, null safety, API key protection." \
            > /tmp/ocr-result.json

      - name: Summarize review failure
        if: ${{ failure() && steps.review.outcome == 'failure' }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('/tmp/ocr-result.json')) return;
            const result = JSON.parse(fs.readFileSync('/tmp/ocr-result.json', 'utf8'));
            // Report error categories without publishing raw provider responses or credentials.
            console.log('Review status:', result.status);
            for (const request of result.retry_report?.requests || []) {
              for (const attempt of request.attempts || []) {
                console.log(JSON.stringify({status: attempt.status_code,
                  classification: attempt.error_class, phase: attempt.failure_phase}));
              }
            }

      - name: Post review comments
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ steps.pr-context.outputs.pr_number }}
          HEAD_SHA: ${{ steps.pr-context.outputs.head_sha }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');

            let result;
            try {
              const raw = fs.readFileSync('/tmp/ocr-result.json', 'utf8');
              result = JSON.parse(raw);
            } catch (e) {
              core.setFailed('Failed to parse OCR output: ' + e.message);
              return;
            }

            if (!result || !['success', 'complete', 'skipped'].includes(result.status) ||
                (result.comments !== null && !Array.isArray(result.comments))) {
              core.setFailed('OCR did not return a complete review');
              return;
            }
            const prNumber = Number(process.env.PR_NUMBER);
            const commitSha = process.env.HEAD_SHA;
            const { data: currentPr } = await github.rest.pulls.get({
              ...context.repo,
              pull_number: prNumber
            });
            if (currentPr.head.sha !== commitSha) {
              core.setFailed('PR head changed during review; review the new commit');
              return;
            }
            const comments = result.comments || [];
            const warnings = result.warnings || [];

            if (comments.length === 0) {
              const message = result.message || 'No issues found.';
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: `✅ **OpenCodeReview**: ${message}`
              });
              return;
            }

            const reviewComments = [];
            const commentsWithoutLine = [];

            for (const comment of comments) {
              const body = formatComment(comment);
              const hasValidLine = (comment.start_line >= 1) || (comment.end_line >= 1);

              if (!hasValidLine) {
                commentsWithoutLine.push({ comment, body });
                continue;
              }

              const rc = { path: comment.path, body };

              if (comment.start_line >= 1 && comment.end_line >= 1 && comment.start_line !== comment.end_line) {
                rc.start_line = comment.start_line;
                rc.line = comment.end_line;
                rc.start_side = 'RIGHT';
                rc.side = 'RIGHT';
              } else if (comment.end_line >= 1) {
                rc.line = comment.end_line;
                rc.side = 'RIGHT';
              } else {
                rc.line = comment.start_line;
                rc.side = 'RIGHT';
              }

              reviewComments.push({ comment, reviewComment: rc });
            }

            let summaryBody = `🔍 **OpenCodeReview** found **${comments.length}** issue(s).`;
            summaryBody += `\n- ✅ ${reviewComments.length} inline comment(s)`;
            summaryBody += `\n- 📝 ${commentsWithoutLine.length} in summary`;
            if (warnings.length > 0) {
              summaryBody += `\n\n⚠️ ${warnings.length} warning(s) during review.`;
            }

            for (const { comment } of commentsWithoutLine) {
              summaryBody += '\n\n---\n\n';
              summaryBody += formatSummaryEntry(comment);
            }

            try {
              await github.rest.pulls.createReview({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
                commit_id: commitSha,
                body: summaryBody,
                event: 'COMMENT',
                comments: reviewComments.map(({ reviewComment }) => reviewComment)
              });
              console.log(`Posted review with ${reviewComments.length} inline comments`);
            } catch (e) {
              console.log('Batch review failed, posting individually:', e.message);

              let posted = 0;
              const failed = [];
              for (const { comment, reviewComment } of reviewComments) {
                try {
                  await github.rest.pulls.createReview({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    pull_number: prNumber,
                    commit_id: commitSha,
                    body: '',
                    event: 'COMMENT',
                    comments: [reviewComment]
                  });
                  posted++;
                } catch (inner) {
                  failed.push({ comment, error: inner.message });
                  console.log(`Failed: ${reviewComment.path} — ${inner.message}`);
                }
              }

              let finalBody = `🔍 **OpenCodeReview** found **${comments.length}** issue(s).`;
              finalBody += `\n- ✅ ${posted} inline comment(s)`;
              finalBody += `\n- 📝 ${commentsWithoutLine.length + failed.length} in summary`;
              if (warnings.length > 0) {
                finalBody += `\n\n⚠️ ${warnings.length} warning(s).`;
              }

              for (const { comment } of commentsWithoutLine) {
                finalBody += '\n\n---\n\n';
                finalBody += formatSummaryEntry(comment);
              }
              for (const { comment, error } of failed) {
                finalBody += '\n\n---\n\n';
                finalBody += `### 📄 \`${comment.path}\``;
                if (comment.start_line >= 1) finalBody += ` (L${comment.start_line})`;
                finalBody += `\n\n⚠️ Failed to post inline: ${error}\n\n${comment.content || ''}`;
              }

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: finalBody
              });
            }

            function formatComment(comment) {
              let body = comment.content || '';
              if (comment.suggestion_code && comment.existing_code) {
                body += '\n\n**Suggestion:**\n';
                body += fencedBlock(comment.suggestion_code, 'suggestion');
              }
              return body;
            }

            function formatSummaryEntry(comment) {
              let md = `### 📄 \`${comment.path}\``;
              if (comment.start_line >= 1 && comment.end_line >= 1) {
                md += ` (L${comment.start_line}-L${comment.end_line})`;
              }
              md += '\n\n' + (comment.content || '');
              if (comment.suggestion_code) {
                md += '\n\n<details><summary>💡 Suggested Change</summary>\n\n';
                md += fencedBlock(comment.suggestion_code) + '\n';
                md += '</details>';
              }
              return md;
            }

            function fencedBlock(content, language) {
              language = language || '';
              const text = String(content || '');
              const matches = text.match(/`+/g) || [];
              const maxTicks = Math.max(3, ...matches.map(t => t.length)) + 1;
              const fence = '`'.repeat(maxTicks);
              return fence + language + '\n' + text + (text.endsWith('\n') ? '' : '\n') + fence;
            }

      - name: Publish review status
        if: ${{ always() && steps.pr-context.outputs.head_sha != '' }}
        uses: actions/github-script@v7
        env:
          HEAD_SHA: ${{ steps.pr-context.outputs.head_sha }}
          REVIEW_STATUS: ${{ job.status }}
        with:
          script: |
            const succeeded = process.env.REVIEW_STATUS === 'success';
            await github.rest.repos.createCommitStatus({
              ...context.repo,
              sha: process.env.HEAD_SHA,
              state: succeeded ? 'success' : 'failure',
              context: 'PR Review',
              description: succeeded ? 'Review completed' : 'Review did not complete successfully',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
